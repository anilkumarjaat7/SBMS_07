<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>
  <p style="color:red" th:if="${error}" th:text="${error}">
    </p>

    <form action="/login" method="post">

        <label>Email</label>
        <br>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <label>Password</label>
        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <a href="/signup">
        Create new account
    </a>

</body>

</html>
